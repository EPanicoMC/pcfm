[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ── Workspace root (non installabile, solo configurazione tool) ──────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Per i package interni vedi: ──────────────────────────────────────────────
#   packages/domain/pyproject.toml
#   apps/api/pyproject.toml
